<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SisVTR — Entrada de Dados</title>
<style>
body{margin:0;background:#f4f7fb;font-family:Inter,system-ui,Segoe UI,Arial;color:#172033}.wrap{max-width:1050px;margin:auto;padding:28px}.card{background:#fff;border:1px solid #e4e9f1;border-radius:18px;padding:24px;box-shadow:0 12px 32px #17203312}h1{margin:0 0 6px;font-size:26px}.sub{color:#687386;font-size:13px;margin-bottom:22px}.note{padding:12px;border-radius:10px;background:#eff6ff;color:#36506f;font-size:12px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}label{font-size:12px;font-weight:700}input,select{width:100%;margin-top:6px;padding:11px;border:1px solid #dce2ea;border-radius:10px;background:#fff}.full{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}button{border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer}.primary{background:#2563eb;color:white}.secondary{background:#eef2f7}.ok{display:none;padding:12px;border-radius:10px;background:#ecfdf5;color:#166534;margin-top:15px;font-size:12px}.err{display:none;padding:12px;border-radius:10px;background:#fef2f2;color:#991b1b;margin-top:15px;font-size:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head>
<body><div class="wrap"><div class="card">
<h1>Entrada de Dados — SisVTR</h1><div class="sub">Cadastro de viaturas, máquinas e equipamentos</div>
<div class="note">O ID do item é gerado automaticamente pelo sistema no momento do cadastro.<br>Acesso exclusivo para lançamento. Esta página não exibe o dashboard nem registros existentes.</div>
<form id="f"><div class="grid">
<label>Prefixo<input name="Prefixo"></label>
<label>Situação<select name="Situacao"><option value="">Selecione...</option></select></label>
<label>Segmentação<select name="Segmentacao"><option value="">Selecione...</option></select></label>
<label>Ano de chegada<input name="AnoChegada" type="number"></label><label>Valor cadastrado<input name="Valor" type="number" step="0.01" min="0"></label>
<label>Tipo<select name="Tipo"><option value="">Selecione...</option></select></label><label>Segmento<select name="Segmento"><option value="">Selecione...</option></select></label>
<label>Tipo de VTR<select name="TipoVtr"><option value="">Selecione...</option></select></label><label>Marca<select name="Marca"><option value="">Selecione...</option></select></label>
<label>Modelo / Descrição<input name="Modelo"></label><label>Ano de fabricação<input name="AnoFabricacao" type="number"></label>
<label>Ano do modelo<input name="AnoModelo" type="number"></label><label>Cor<select name="Cor"><option value="">Selecione...</option></select></label>
<label>OBM<select name="Obm"><option value="">Selecione...</option></select></label>
<label class="full">Classificação<select name="Classificacao"><option value="">Selecione...</option></select></label>
</div><div class="actions"><button type="reset" class="secondary">Limpar</button><button class="primary">Cadastrar item</button></div>
<div id="ok" class="ok"></div><div id="err" class="err"></div></form>
</div></div>
<script>
const f=document.querySelector('#f'),ok=document.querySelector('#ok'),err=document.querySelector('#err'); const entryToken=new URLSearchParams(location.search).get('chave')||'';
const lists={"Situacao": ["Alienação", "Atualizado", "Baixa Veicular", "Cessao De Uso", "Cessao De Uso – Não Abastece", "Cessão De Uso – Dert", "Cmcb", "Devolvido", "Indisponivel/Baixada", "Locada", "Museu", "Não Localizado", "Para Descarga", "Para Descarga Com Pendencia", "Para Descarga_Tramd_2021", "Para Descarga_Tramd_2022", "Para Descarga_Tramd_2023", "Retirar – Em Uso"], "Segmentacao": ["ADM", "ADM MOTO", "EQUI", "INVALID", "MAQ", "OP"], "Tipo": ["Equipamento", "Locada", "Máquina", "Placa", "VTR"], "Segmento": ["Grande Porte", "INVALID", "Moto", "Médio Porte", "Pequeno Porte"], "TipoVtr": ["Caminhão", "Carro", "INVALID", "Moto", "Outros"], "Marca": ["AGRALE", "BAUER", "BERG STELL", "BFG 4T", "BOSCH", "BRANCO", "BRP", "BUFALO", "BUFFALO", "CFMOTO", "COLTRI SUB", "DEWALT", "DJI", "DJJ", "E FORCE2", "E FORCE3", "ELISABETE", "ENDRESS", "ENDURO OHV", "FIAT", "FIAT/IVECO", "FLIR", "FORD", "FREE HOBBY", "GM", "GS", "GUARANY", "HERCULES", "HIDEA", "HOLMATRO", "HONDA", "HUMBAUER", "HURST", "HURTS", "HUSQVARNA", "HYPALON", "HYUNDAI", "I/SCANIA", "INTERTEC", "INVALID", "IVECO", "JEEP", "KOHLER", "LANCIER", "LEADER FAN EASY POW AIR", "M.BENZ", "MAGIRUS", "MAGIRUS MOTOREN", "MAQTRON", "MAQUITA", "MARCOPOLO", "MAST PUMPEN", "MB", "MERCURY", "MERCURY YAMAHA", "METAL GLASS", "METALURGICA-RODON", "MITISUBISH", "MMC/TRITON", "NARDI", "NARGUILLE", "NAVIGATOR", "NISSAN", "POLIMAQ", "POLIMARINE", "PRAMAC", "PROMED", "RANDON", "REBOCAR", "RENAULT", "ROBIM", "ROCAIE", "RODON", "RUSSO", "SCANIA", "SHULZ", "SILK BRINDES", "STHIL", "STHILL", "STIHL", "STREAMIGHT", "TECNISUB", "TECUMSEH", "TOYAMA", "TOYOMA", "TOYOTA", "TROLLER", "ULTRAMAR", "VOLVO", "VW", "WEBER", "YAMAHA", "ZEFIR"], "Cor": ["Amarela", "Amarela Com Preta", "Azul", "Azul Metalico", "Branca", "Branca Com Verde", "Branca Com Vermelha", "Branco Summit", "Cinza", "Cinza Com Laranja", "Cinza/Vermelha", "Cor Predominante Branca", "Cor Predominante Laranja", "Cor Predominante: Laranja", "Cor Predominante: Laranja Com Preta", "INVALID", "Laranja", "Laranja Com Amarela", "Laranja Com Preta", "Marrom", "Prata", "Preta", "Preta Com Laranja", "Preta Com Vermelha", "Verde", "Vermelha", "Vermelha Com Branca", "Vermelha Com Laranja", "Vermelha E Casco Bca"], "Obm": ["1ª CBCAES/BBS - JOSE WALTER", "1ª CBS/BBS - MOURA BRASIL", "1ª CIA/1º BBM - JACARECANGA", "1ª CIA/2º BBM - MARACANAU", "1ª CIA/3º BBM - SOBRAL", "1ª CIA/4º BBM - IGUATU", "1ª CIA/5º BBM - JUAZEIRO DO NORTE", "1ª CIA/6º BBM - LIMOEIRO DO NORTE", "1ª CIF/5º BBM - CRATO", "1ª CIF/6º BBM - QUIXADA", "1ª CMR/BSMAR - MOURA BRASIL", "1ª CSMAR/BSMAR - PRAIA DO FUTURO", "1ª CSU/BSU - MARAPONGA", "1º BBM - FORTALEZA", "2ª CBS/BBS - CAMBEBA", "2ª CIA/1º BBM - MUCURIPE", "2ª CIA/2º BBM - HORIZONTE", "2ª CIA/3º BBM - CANINDE", "2ª CIA/4º BBM - CRATEUS", "2ª CIA/5º BBM - CRATO", "2ª CIA/6º BBM - QUIXERAMOBIM", "2ª CPI/BPI - TRIBUNAL DE JUSTIÇA", "2ª CSMAR/BSMAR - ICARAI", "2º BBM", "3ª CIA/1º BBM - MESSEJANA", "3ª CIA/2º BBM - CAUCAIA", "3ª CIA/3º BBM - ITAPIPOCA", "3ª CIA/4º BBM - TAUA", "3ª CIA/5º BBM - AEROPORTO DE JUAZEIRO DO NORTE", "3ª CIA/6º BBM - BATURITE", "4ª CIA/1º BBM - JOSE WALTER", "4ª CIA/2º BBM - SAO GONCALO DO AMARANTE", "4ª CIA/3º BBM - IPUEIRAS", "4º BBM", "5ª CIA/1º BBM - CONJUNTO CEARA", "5ª CIA/2º BBM - ARACATI", "5ª CIA/3º BBM - JIJOCA DE JERICOACOARA", "6ª CIA/3º BBM - CAMOCIM", "7ª CIA/1º BBM - CISP", "8ª CIA/1º BBM - 15 DE OUTUBRO", "ASCOM", "ASINT", "BBS", "BCIF", "BIOPSICOSSOCIAL", "BSMAR", "CBC", "CBI", "CEDEC", "CEL CG", "CEPI", "CETIC", "CGO", "CGP", "CMCB", "CMD ADJ", "COMALP", "CTDH", "DPGI", "MUSEU", "NAPD", "QCG"], "Classificacao": ["Caminhão - Cavalim", "Caminhão Com Cesto", "Carros De Combate", "Embarcacoes", "Equipamentos De Protecao, Seguranca E Socorro", "Equipamentos, Pecas E Acessorios Maritimos", "Equipamentos, Pecas E Acessorios Para Automoveis", "INVALID", "Outras Maquinas, Aparelhos, Equipamentos E Ferramentas", "Quadriciclo", "Veiculos De Tracao Mecanica"]};
for(const [name,items] of Object.entries(lists)){const s=f.elements[name]; if(!s)continue; s.innerHTML='<option value="">Selecione...</option>'+items.map(x=>'<option>'+String(x).replaceAll('&','&amp;').replaceAll('<','&lt;')+'</option>').join('')}
f.addEventListener('submit',async e=>{e.preventDefault();ok.style.display='none';err.style.display='none';const data=Object.fromEntries(new FormData(f));try{const r=await fetch('/api/public-entry',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...data,token:entryToken})});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Não foi possível cadastrar.');ok.textContent='Item cadastrado com sucesso.';ok.style.display='block';f.reset()}catch(x){err.textContent=x.message;err.style.display='block'}})
</script></body></html>
